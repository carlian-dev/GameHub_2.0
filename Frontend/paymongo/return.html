<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Payment status — GameHub</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Poppins", system-ui, sans-serif;
      background: #0f1115;
      color: #f5f1e8;
    }
    .card {
      width: min(440px, 100%);
      padding: 36px 28px;
      border-radius: 24px;
      background: #191c22;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }
    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(52, 211, 153, 0.14);
      color: #34d399;
      font-size: 30px;
      font-weight: 700;
    }
    .card.cancelled .mark {
      background: rgba(251, 191, 36, 0.14);
      color: #fbbf24;
    }
    h1 { margin: 0 0 10px; font-size: 1.5rem; }
    p { margin: 0 0 24px; line-height: 1.6; color: #b9b3a7; }
    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 999px;
      background: #f5c451;
      color: #17130a;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="mark" id="mark" aria-hidden="true">✓</div>
    <h1 id="title">Payment received</h1>
    <p id="message">You can close this window. The cashier will confirm the bill.</p>
    <a href="/">Back to GameHub</a>
  </main>
  <script>
    (function () {
      var status = "";
      try {
        status = new URLSearchParams(window.location.search).get("status") || "";
      } catch (_) { /* old browser */ }
      if (status === "cancelled") {
        document.getElementById("card").classList.add("cancelled");
        document.getElementById("mark").textContent = "!";
        document.getElementById("title").textContent = "Payment cancelled";
        document.getElementById("message").textContent =
          "No payment was made. You can close this window and ask the cashier for another link.";
      }
    })();
  </script>
</body>
</html>
