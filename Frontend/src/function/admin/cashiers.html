<!DOCTYPE html>
<!--
  src/function/admin/cashiers.html - Staff table in the dashboard shell.
  Pair: cashiers.js (tabs incl. Invitations, search, edit/archive/unarchive)
  + js/dash.js (shell + dialogs/toasts). Backend:
  server/src/routes/admin.routes.js (cashiers + invitations endpoints).
  Tabs: Invitations / Active / Archived (cashiers only). Invite IS the
  approval — new accounts arrive active, no Applicants tab.
  Invite button mails a 24h single-use link; pending links resend/revoke here.
  Tabs are real ARIA tabs (dashTabsInit) over one tabpanel.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff — GameHub admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700;1,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/dashboard.css" />
  <link rel="stylesheet" href="../../../css/settings.css" />
</head>
<body class="dash" data-theme="light">
  <div class="dash-app">
    <aside class="dash-side" aria-label="Admin navigation">
      <a class="dash-brand" href="./admin-dashboard.html">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#F5F3ED" stroke-width="2" /><circle cx="16" cy="16" r="4" fill="#D4AF37" /><path d="M16 3v6M16 23v6M3 16h6M23 16h6" stroke="#F5F3ED" stroke-width="2" /></svg>
        <span class="brand-text"><span class="brand-name">GameHub</span><span class="brand-tag">Billiard &amp; More</span></span>
      </a>
      <nav class="dash-nav">
        <a href="./admin-dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" /></svg>
          <span>Dashboard</span>
        </a>
        <a href="./cashiers.html" class="active" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5" /><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 15.2c1.7.8 2.7 2.3 3 4.8" /></svg>
          <span>Staff</span>
        </a>
        <a href="../tables/tables.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="2.6" /></svg>
          <span>Tables</span>
        </a>
        <a href="../tables/rates.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9-9-9Z" /><circle cx="8" cy="8" r="1.6" /></svg>
          <span>Rates</span>
        </a>
        <a href="../tables/sessions.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3.2 2" /></svg>
          <span>Sessions</span>
        </a>
        <a href="./transactions.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V4" /><path d="M4 20h16" /><path d="M8 16v-5M12 16V8M16 16v-3M20 16V6" /></svg>
          <span>Transactions</span>
        </a>
      </nav>
      <div class="dash-user">
        <span class="avatar-circle" id="avatar">A</span>
        <div><strong id="who">Checking...</strong><small>Admin</small></div>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-top">
        <button class="dash-iconbtn dash-menu" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <div class="dash-top-right">
          <div data-admin-settings data-settings-url="./settings.html"></div>
        </div>
      </header>

      <main class="dash-content">
        <div class="dash-pagehead">
          <h1>Staff</h1>
          <span>Invitations, active cashiers and archived accounts · <span class="dash-stamp" id="stamp"></span></span>
        </div>

        <div class="dash-tabs" role="tablist" aria-label="Staff views">
          <button type="button" data-t="invites">Invitations</button>
          <button type="button" data-t="active" class="on">Active</button>
          <button type="button" data-t="archived">Archived</button>
        </div>

        <section class="dash-panel" id="staffPanel" role="tabpanel" tabindex="0" aria-label="Staff list">
          <div class="panel-head">
            <label class="dash-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
              <input id="q" type="search" placeholder="Search email, username or name" aria-label="Search staff" />
            </label>
            <button type="button" class="btn btn-solid" id="invite">Invite cashier</button>
          </div>

          <p class="dash-msg" id="msg" role="status">Loading…</p>

          <div class="dash-tablewrap">
            <table id="tbl">
              <thead id="tblHead">
                <tr><th>Email / Username</th><th>Status</th><th>Name</th><th>Schedule</th><th>Actions</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <p class="dash-empty" id="empty" hidden>No rows in this view.</p>
        </section>
      </main>
    </div>
  </div>
  <script src="../../../js/config.js"></script>
  <script src="../../../js/api.js"></script>
  <script src="../../../js/dash.js"></script>
  <script src="./cashiers.js"></script>
</body>
</html>
