<!DOCTYPE html>
<!--
  src/function/shared/receipt.html - customer receipt (Sprint 3).
  Query: ?ref=GH-YYYYMMDD-XXXX (+ optional &admin=1 for admin viewers).
  Cashier view uses GET /api/cashier/transactions/{ref}; pass &admin=1 to use
  the admin twin. Renders one transaction + in-page PDF preview (jsPDF,
  vendored at js/vendor/jspdf.umd.min.js) + Download PDF button.
  No window.print() - direct download, no laptop print dialog.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receipt — GameHub</title>
  <link rel="stylesheet" href="../../../css/dashboard.css" />
  <style>
    .receipt { max-width: 820px; margin: 24px auto; background: var(--d-surface); border: 1px solid var(--d-border); border-radius: 12px; padding: 24px; }
    .receipt h1 { font-family: Georgia, 'Times New Roman', serif; margin: 0 0 4px; font-size: 22px; }
    .receipt .muted { color: var(--d-muted); font-size: 13px; margin: 0 0 12px; }
    .receipt table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 12px 0; }
    .receipt td { padding: 6px 0; border-bottom: 1px dashed var(--d-border); }
    .receipt td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .receipt .total td { font-weight: 700; font-size: 16px; border-bottom: none; }
    .pdf-wrap { margin-top: 16px; }
    #pdfPreview { width: 100%; height: 600px; border: 1px solid var(--d-border); border-radius: 8px; background: #fff; }
    .receipt-actions { display: flex; gap: 10px; margin-top: 16px; }
    .receipt-actions .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body class="dash" data-theme="dark">
  <div class="dash-app">
    <aside class="dash-side" aria-label="Navigation">
      <a class="dash-brand" href="./receipt.html">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#3fa46a" stroke-width="2" /><circle cx="16" cy="16" r="4" fill="#3fa46a" /><path d="M16 3v6M16 23v6M3 16h6M23 16h6" stroke="#3fa46a" stroke-width="2" /></svg>
        <span>GameHub</span>
      </a>
      <nav class="dash-nav">
        <a href="javascript:history.back()"><span>← Back</span></a>
      </nav>
    </aside>
    <div class="dash-main">
      <header class="dash-top">
        <div class="dash-top-right">
          <button class="dash-theme" aria-label="Toggle theme">
            <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 13.2A8.2 8.2 0 1 1 10.8 4 6.6 6.6 0 0 0 20 13.2Z" /></svg>
            <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4" /><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8" /></svg>
          </button>
        </div>
      </header>
      <main class="dash-content">
        <div class="dash-pagehead"><h1>Receipt</h1><span>PDF preview → Download</span></div>
        <div class="receipt" id="receipt">
          <h1>GameHub</h1>
          <p class="muted">Billiard hall receipt · <span id="rRef">…</span></p>
          <div class="dash-msg" id="msg">Loading...</div>
          <table id="rTbl" hidden>
            <tr><td>Table</td><td id="rTable">—</td></tr>
            <tr><td>Customer</td><td id="rCustomer">—</td></tr>
            <tr><td>Cashier</td><td id="rCashier">—</td></tr>
            <tr><td>Paid at</td><td id="rPaid">—</td></tr>
            <tr><td>Time played</td><td id="rMinutes">—</td></tr>
            <tr><td>Rate</td><td id="rRate">—</td></tr>
            <tr><td>Method</td><td id="rMethod">—</td></tr>
            <tr><td>Received</td><td id="rReceived">—</td></tr>
            <tr class="total"><td>Total</td><td id="rTotal">—</td></tr>
            <tr><td>Change</td><td id="rChange">—</td></tr>
          </table>
          <div class="pdf-wrap">
            <iframe id="pdfPreview" title="Receipt PDF preview"></iframe>
          </div>
          <div class="receipt-actions">
            <button class="btn btn-solid" id="download" disabled>Download PDF</button>
            <button class="btn btn-ghost" id="back">Back</button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../../../js/config.js"></script>
  <script src="../../../js/api.js"></script>
  <script src="../../../js/dash.js"></script>
  <script src="../../../js/vendor/jspdf.umd.min.js"></script>
  <script src="./receipt.js"></script>
</body>
</html>
