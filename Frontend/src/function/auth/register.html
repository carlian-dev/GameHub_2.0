<!DOCTYPE html>
<!--
  src/function/auth/register.html - invitation-gated cashier signup.
  Pair: register.js <-> Backend/src/function/auth/register.php (token enforced
  server-side; page checks are convenience only, never trust).
  Opened ONLY from the emailed link (?token=...). No token or a dead link
  shows a dead-end state naming the administrator as contact. Valid link:
  invited email shown locked, first/last/username/password form (real <form>,
  Enter submits, per-field validation), account is active immediately
  (invite IS the approval, no waiting).
  Links use root-absolute /index.html (same convention as login.html).
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create cashier account — GameHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700;1,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/styles.css" />
</head>
<body class="staff">
  <header class="nav nav-slim">
    <a class="brand" href="/index.html" aria-label="GameHub home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="#F5F3ED" stroke-width="2" />
        <circle cx="16" cy="16" r="4" fill="#D4AF37" />
        <path d="M16 3v6M16 23v6M3 16h6M23 16h6" stroke="#F5F3ED" stroke-width="2" />
      </svg>
      <span class="brand-text">
        <span class="brand-name">GameHub</span>
        <span class="brand-tag">Billiard &amp; More</span>
      </span>
    </a>
    <nav class="nav-links" aria-label="Primary">
      <a href="/index.html">&larr; Back to site</a>
    </nav>
  </header>

  <main class="staff-main">
    <p class="eyebrow eyebrow-gold"><span></span>Create account<span></span></p>
    <h1 class="staff-title">Create cashier account</h1>
    <p class="staff-sub" id="lede">Your invitation is pre-approved — your account is <strong>active</strong> immediately and you can log in right away.</p>

    <section class="staff-card" id="dead" hidden>
      <p class="staff-sub" id="deadMsg"></p>
      <p class="cta-row">
        <a class="btn btn-ghost" href="/index.html">&larr; Back to site</a>
      </p>
    </section>

    <section class="staff-card" id="form" hidden>
      <form id="registerForm" novalidate>
        <label class="field" for="first">
          <span>First name</span>
          <input id="first" name="first" type="text" placeholder="Juan" autocomplete="given-name" required />
        </label>
        <label class="field" for="last">
          <span>Last name</span>
          <input id="last" name="last" type="text" placeholder="Dela Cruz" autocomplete="family-name" required />
        </label>
        <label class="field" for="email">
          <span>Email (from your invitation — locked)</span>
          <input id="email" name="email" type="email" readonly autocomplete="email" />
        </label>
        <label class="field" for="username">
          <span>Username (3-30: letters, numbers, . _ -)</span>
          <input id="username" name="username" type="text" placeholder="juan.cashier" autocomplete="username" required />
        </label>
        <label class="field" for="password">
          <span>Password (min 8)</span>
          <input id="password" name="password" type="password" autocomplete="new-password" required />
        </label>
        <label class="field" for="confirm">
          <span>Confirm password</span>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />
        </label>
        <button id="go" type="submit" class="btn btn-solid btn-block">Create account</button>
      </form>
      <div id="msg" role="status"></div>
    </section>

    <p class="cta-row">
      <a class="btn btn-ghost" href="./login.html">Log in</a>
    </p>
  </main>
  <script src="../../../js/config.js"></script>
  <script src="../../../js/api.js"></script>
  <script src="./register.js"></script>
</body>
</html>
