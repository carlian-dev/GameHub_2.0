<!DOCTYPE html>
<!--
  src/function/cashiers/cashier-tables.html - cashier Tables page (read-only).
  Pair: cashier-tables.js (filter + live statuses CA-003/CA-017) +
  cashier-common.js (guard) + js/dash.js (shell + ARIA tabs).
  Sidebar: Dashboard, Sessions, Reservations, Tables (active). Guard: cashiers stay.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tables — GameHub cashier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700;1,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/dashboard.css" />
</head>
<body class="dash" data-theme="light">
  <div class="dash-app">
    <aside class="dash-side" aria-label="Cashier navigation">
      <a class="dash-brand" href="./cashier-dashboard.html">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#F4F1E6" stroke-width="2" /><circle cx="16" cy="16" r="4" fill="#D4B44D" /><path d="M16 3v6M16 23v6M3 16h6M23 16h6" stroke="#F4F1E6" stroke-width="2" /></svg>
        <span class="brand-text"><span class="brand-name">GameHub</span><span class="brand-tag">Billiard Hall and Sport Bar</span></span>
      </a>
      <nav class="dash-nav">
        <a href="./cashier-dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" /></svg>
          <span>Dashboard</span>
        </a>
        <a href="./cashier-sessions.html" title="Active sessions with live timers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="17" rx="2" /><path d="M9 4a3 3 0 0 1 6 0" /><path d="M9 11h6M9 15h4" /></svg>
          <span>Sessions</span>
        </a>
        <a href="./cashier-menu.html" title="Food and beverage menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3v6a3 3 0 0 0 6 0V3" /><path d="M8 9v12" /><path d="M16 3h2a3 3 0 0 1 0 6h-2" /><path d="M18 9v12" /></svg>
          <span>Menu</span>
        </a>
        <a href="./cashier-reservations.html" title="Customer reservation requests">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="16" rx="2" /><path d="M4 10h16M8 3v4M16 3v4" /><path d="M9 15l2 2 4-4" /></svg>
          <span>Reservations</span>
        </a>
        <a href="./cashier-tables.html" class="active" aria-current="page" title="Tables live statuses (read-only)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="2.6" /></svg>
          <span>Tables</span>
        </a>
      </nav>
      <div class="dash-user">
        <span class="avatar-circle" id="avatar">C</span>
        <div><strong id="who">Checking...</strong><small>Cashier</small></div>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-top">
        <button class="dash-iconbtn dash-menu" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <div class="dash-top-right">
          <button class="dash-theme" aria-label="Toggle theme">
            <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 13.2A8.2 8.2 0 1 1 10.8 4 6.6 6.6 0 0 0 20 13.2Z" /></svg>
            <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4" /><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8" /></svg>
          </button>
          <button class="dash-logout" id="out">Log out</button>
        </div>
      </header>

      <main class="dash-content">
        <div class="dash-pagehead"><h1>Tables</h1><span data-today></span></div>

        <div class="dash-tabs" role="tablist" aria-label="Filter tables by status">
          <button type="button" data-t="all" class="on">All</button>
          <button type="button" data-t="available">Available</button>
          <button type="button" data-t="occupied">Occupied</button>
          <button type="button" data-t="reserved">Reserved</button>
        </div>

        <section class="dash-panel" id="tables-panel" role="tabpanel" tabindex="0" aria-label="Tables list">
          <div class="panel-head">
            <h2>Live table statuses</h2>
            <span class="dash-stamp" id="tablesUpdated"></span>
          </div>
          <p>Read-only · refreshes every 30 seconds.</p>
          <div class="dash-msg" id="tablesMsg" role="status">Loading…</div>
          <div class="dash-tablewrap">
            <table id="cashierTbl">
              <thead><tr><th>Name</th><th>Status</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <p class="dash-empty" id="tablesEmpty" hidden>No tables in this view.</p>
        </section>
      </main>
    </div>
  </div>
  <script src="../../../js/config.js"></script>
  <script src="../../../js/api.js"></script>
  <script src="../../../js/dash.js"></script>
  <script src="./cashier-common.js"></script>
  <script src="./cashier-tables.js"></script>
</body>
</html>
